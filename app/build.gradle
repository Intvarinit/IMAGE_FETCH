plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.imagefetch"
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "com.imagefetch"
        minSdk 26
        targetSdk 35
        versionCode 68
        versionName "0.8.48"

        // OpenCV 的 Android wheel 只提供到 4.5.1.48，且只编译了 cp38/cp310，
        // 所以 app 的 Python 锁 3.10、ABI 只留 64 位的 arm64-v8a。
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

// 景深合成可行性验证：确认 Python 3.10 运行时与 OpenCV wheel 能否装进来、体积涨多少。
// buildPython 不写死路径，交给 Chaquopy 自己按 `py -3.10` 找（本机 3.13 仍是默认，不受影响）。
chaquopy {
    defaultConfig {
        version = "3.10"
        pip {
            install("numpy")
            install("opencv-python==4.5.1.48")
        }
    }
}
